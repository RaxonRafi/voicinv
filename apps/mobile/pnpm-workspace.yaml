allowBuilds:
  '@parcel/watcher': false
# pnpm settings for the mobile app. The app is a standalone project with its own lockfile; this
# file holds settings only (there is no `packages` list).
minimumReleaseAgeExclude:
  - prettier@3.10.0
  - '@expo/cli@58.1.20'
  - '@expo/router-server@58.0.22'
  - expo-asset@58.0.21
  - expo-linking@58.0.17
  - expo-router@58.0.31
  - expo@58.0.24
