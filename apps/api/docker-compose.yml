# Local development services for the API. The API itself runs on the host with `pnpm dev`;
# only its backing services live here.
#
#   docker compose up -d postgres
#
# Credentials match .env.example and are for local development only.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceledger
      POSTGRES_PASSWORD: voiceledger
      POSTGRES_DB: voiceledger
    ports:
      # Bound to localhost so the development database is never reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first created: adds the database used by e2e tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voiceledger -d voiceledger']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
